<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Galeri · Sıla Urun Beauty</title>
  <meta name="description" content="Sıla Urun Beauty galerisi.">
  <meta name="theme-color" content="#12100E">
  <link rel="icon" href="assets/favicon.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=Great+Vibes&family=Outfit:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <script>document.documentElement.classList.add("js"); if (!matchMedia("(prefers-reduced-motion: reduce)").matches) document.documentElement.classList.add("is-entering");</script>
  <style>.wipe{position:fixed;inset:0;z-index:200;background:#12100e;pointer-events:none;transform:scaleY(0);transform-origin:bottom}html.is-entering .wipe{animation:suWipe .85s cubic-bezier(.76,0,.24,1) forwards}@keyframes suWipe{from{transform:scaleY(1)}to{transform:scaleY(0)}}</style>
</head>
<body data-page="gallery">
<script src="js/chrome.js"></script>
<main id="icerik">
  <section class="subhero">
    <div class="hero-bg" style="background-image:url('assets/glow2.jpg')"></div>
    <div class="hero-shade"></div>
    <div class="wrap">
      <p class="crumb"><a href="index.html">Ana Sayfa</a> · Galeri</p>
      <h1>Işık, doku, sükunet</h1>
      <p class="sublead">Bakım anlarından bir seçki. Kareye tıklayınca büyür.</p>
    </div>
  </section>
  <section class="section">
    <div class="wrap">
      <div class="filters" role="tablist">
        <button class="is-on" type="button" data-filter="all">Tümü</button>
        <button type="button" data-filter="bakim">Bakım</button>
        <button type="button" data-filter="makyaj">Makyaj</button>
        <button type="button" data-filter="rituel">Ritüel</button>
      </div>
      <div class="masonry">
        <figure class="shot tall" data-cat="bakim"><a href="assets/hands.jpg" data-lightbox><img src="assets/hands.jpg" alt="Yüz bakımı"></a><figcaption>Yüz bakımı</figcaption></figure>
        <figure class="shot wide" data-cat="bakim"><a href="assets/facial.jpg" data-lightbox><img src="assets/facial.jpg" alt="Maske"></a><figcaption>Maske</figcaption></figure>
        <figure class="shot tall" data-cat="makyaj"><a href="assets/portrait.jpg" data-lightbox><img src="assets/portrait.jpg" alt="Makyaj"></a><figcaption>Makyaj</figcaption></figure>
        <figure class="shot wide" data-cat="rituel"><a href="assets/glow2.jpg" data-lightbox><img src="assets/glow2.jpg" alt="Masaj"></a><figcaption>Masaj</figcaption></figure>
        <figure class="shot wide" data-cat="bakim"><a href="assets/hero.jpg" data-lightbox><img src="assets/hero.jpg" alt="Yüz masajı"></a><figcaption>Yüz masajı</figcaption></figure>
        <figure class="shot tall" data-cat="rituel"><a href="assets/woman.jpg" data-lightbox><img src="assets/woman.jpg" alt="Nem bakımı"></a><figcaption>Nem</figcaption></figure>
        <figure class="shot wide" data-cat="rituel"><a href="assets/laser.jpg" data-lightbox><img src="assets/laser.jpg" alt="Vücut bakımı"></a><figcaption>Vücut bakımı</figcaption></figure>
        <figure class="shot wide" data-cat="bakim"><a href="assets/glow.jpg" data-lightbox><img src="assets/glow.jpg" alt="Bakım dokuları"></a><figcaption>Dokular</figcaption></figure>
      </div>
    </div>
  </section>
</main>
<script src="js/chrome.js"></script>
<script src="js/main.js"></script>
</body>
</html>
